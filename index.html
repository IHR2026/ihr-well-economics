const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.it,hash:"SHA-256"},km,
    {name:"AES-GCM",length:256},true,["decrypt"]);
}
async function open_(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function tryStored(){
  try{const jwk=localStorage.getItem("ihrK");
    if(!jwk)return;
    const key=await crypto.subtle.importKey("jwk",JSON.parse(jwk),{name:"AES-GCM"},true,["decrypt"]);
    await open_(key);
  }catch(e){try{localStorage.removeItem("ihrK");}catch(_){}}
}
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const btn=document.getElementById("go"),err=document.getElementById("err");
  btn.disabled=true;btn.textContent="Unlocking…";err.textContent="";
  try{
    const key=await derive(document.getElementById("pw").value);
    if(document.getElementById("rem").checked){
      try{const jwk=await crypto.subtle.exportKey("jwk",key);
        localStorage.setItem("ihrK",JSON.stringify(jwk));}catch(_){}}
    await open_(key);
  }catch(e){
    err.textContent="Wrong password — try again.";
    btn.disabled=false;btn.textContent="Unlock";
  }
});
tryStored();
})();
